name: tighter_fcnn_sweep
project: cost_model_variants
program: train_model.py # tell wandb what to launch
command: # tell wandb how to pass args
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens} # gives “param=value”, perfect for Hydra

method: random
metric:
  name: val_mape
  goal: minimize

parameters:
  model.mlp_num_layers: { values: [6, 7, 8] }
  model.mlp_width: { values: [128, 256, 384, 512, 640, 896] }
  # ─────── model head ─────────
  # model.mlp_layer_sizes:
  #   values:
  #     - "[1024, 512, 256, 128, 64, 32]"
  #     - "[1024, 512, 256, 128, 64]"
  #     - "[512, 256, 128, 64]"
  #     - "[256, 128, 64]"

  model.mlp_dropout: { values: [0.0, 0.05, 0.10, 0.15] }

  # ───────── optimiser ─────────
  training.lr:
    distribution: log_uniform_values
    min: 0.0001 # 1e-4
    max: 0.001 # 1e-3

  training.weight_decay:
    distribution: log_uniform_values
    min: 0.00000001
    max: 0.001
