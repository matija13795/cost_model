name: tighter5
project: fcnn_alternative
program: train_model.py
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

method: random
metric:
  name: val_mape
  goal: minimize

parameters:
  # kept static from best tighter sweep
  model.mlp_num_layers: { values: [10, 15, 20] }
  model.mlp_width: { values: [8, 16, 32] }
  model.mlp_dropout: { value: 0 }
  training.max_epochs: { value: 40 }
  training.lr:
    distribution: uniform  # switched to a uniform distribution since we are within 1 order of magnitude
    min: 0.0055  # 5e-3
    max: 0.0155  # 1e-2
  training.weight_decay:
    distribution: log_uniform_values
    min: 0.00008  # 8e-5
    max: 0.03     # 3e-2

  # new search space
  model.activation:
    values: ["elu"]

  model.norm_type:
    values: ["none"]

early_terminate:
  type: hyperband
  min_iter: 10
  s: 2
