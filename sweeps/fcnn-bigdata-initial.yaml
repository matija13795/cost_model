name: fcnn_bigdata_stageA
project: fcnn_alternative
program: train_model.py
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
  - data_generation.train_dataset_file=scratch/cost_model/datasets/dataset_expr_dataset_batch550000-838143+batch101-1227605_train_part_1_of_22_forFCNN.pkl
  - data_generation.valid_dataset_file=scratch/cost_model/datasets/val_subset_250k_forFCNN.pkl
  - training.max_epochs=40
  - training.validation_gpu=cuda:0
  - training.save_checkpoints=false
  - model=fcnn
  - model.max_comps=14
  - model.norm_type=none
  - model.mlp_dropout=0
  - model.activation=gelu

method: random
metric:
  name: val_mape
  goal: minimize

parameters:
  model.mlp_num_layers:
    values: [8, 12, 16, 20, 24]
  model.mlp_width:
    values: [8, 12, 16, 24, 32, 48]

  training.weight_decay:
    distribution: log_uniform_values
    min: 0.000003
    max: 0.008
  training.lr:
    distribution: log_uniform_values
    min: 0.005
    max: 0.030

early_terminate:
  type: hyperband
  min_iter: 10
  s: 2