name: tighter4
project: fcnn_alternative
program: train_model.py
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

method: random
metric:
  name: val_mape
  goal: minimize

parameters:
  # kept static from best tighter sweep
  model.mlp_num_layers: { values: [10, 12] }
  model.mlp_width: { values: [32, 64, 96] }
  model.mlp_dropout:
    distribution: uniform
    min: 0.0
    max: 0.02
  training.max_epochs: { value: 40 }
  training.lr:
    distribution: uniform  # switched to a uniform distribution since we are within 1 order of magnitude
    min: 0.0034  # 3e-3
    max: 0.0084  # 8e-3
  training.weight_decay:
    distribution: log_uniform_values
    min: 0.00002  # 2e-5
    max: 0.1      # 1e-1

  # new search space
  model.activation:
    values: ["elu"]

  model.norm_type:
    values: ["none"]

early_terminate:
  type: hyperband
  min_iter: 10
  s: 2
